databases:
  - name: placement-db
    databaseName: placement_checker
    user: placement_user
    plan: free

services:
  - type: web
    name: placement-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placement-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: placement-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: placement-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://placement-frontend.onrender.com

  - type: web
    name: placement-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://placement-api.onrender.com