databases:
  - name: placement-db
    region: singapore
    plan: free

services:
  - type: web
    name: placement-api
    runtime: docker
    rootDir: backend
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placement-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: placement-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: placement-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: placement-frontend
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: placement-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://placement-api-5rlf.onrender.com